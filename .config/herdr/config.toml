[keys]
prefix = "alt+space"
help = "prefix+?"
reload_config = "prefix+shift+r"
detach = "prefix+shift+q"
goto = "prefix+f"
new_tab = "alt+n"
previous_tab = ""
next_tab = ""
switch_tab = "alt+1..9"
rename_tab = "alt+r"
close_tab = "alt+shift+q"
split_vertical = "alt+backslash"
split_horizontal = "alt+shift+backslash"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
close_pane = "alt+q"
zoom = "alt+f"
resize_mode = "prefix+r"
copy_mode = "prefix+v"
cycle_pane_next = ""
toggle_sidebar = "prefix+tab"

[[keys.command]]
key = "prefix+m"
type = "popup"
command = "exec \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/move-pane\""
description = "move pane to tab"
width = "80%"
height = "80%"

[ui]
prompt_new_tab_name = false
sidebar_collapsed_mode = "hidden"
pane_borders = true
pane_gaps = false

[theme]
name = "tokyo-night"
auto_switch = false
