# Prefix and input timing.
set -g prefix M-Space
set -g prefix2 None
set -s escape-time 10

# Session, window, and pane behavior.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g mouse on
set -g mode-keys vi
set -g status-keys vi
set -s focus-events on
set -s allow-passthrough on

# Terminal identity and negotiated capabilities.
set -s default-terminal "tmux-256color"
# A fixed array slot keeps repeated reloads idempotent.
set -s terminal-features[100] "xterm-ghostty:RGB:clipboard:extkeys"
set -s extended-keys on
if-shell 'tmux show-options -sv extended-keys-format >/dev/null 2>&1' 'set-option -s extended-keys-format csi-u'

# Keep argument-free copy-pipe routes local without launching an external command.
set -s copy-command ""
# tmux may write the outer clipboard through OSC 52, but pane applications may not.
set -s set-clipboard external
