# Shared tmux entry point.
# Readability checks provide exact missing-path diagnostics before any module loads.
# The aggregate native source command's exit status is the only path to success.
set-option -g @dotfiles_foundation_loaded 0
set-option -guq @dotfiles_platform

if-shell 'for file in "$HOME/.config/tmux/conf/options.conf" "$HOME/.config/tmux/conf/keys.conf" "$HOME/.config/tmux/conf/persistence.conf" "$HOME/.config/tmux/conf/status.conf"; do test -r "$file" || exit 1; done' {
  if-shell 'test "$(uname -s)" = Darwin' {
    if-shell 'test -r "$HOME/.config/tmux/conf/platform/macos.conf"' {
      if-shell 'tmux -S "#{socket_path}" source-file "$HOME/.config/tmux/conf/options.conf" "$HOME/.config/tmux/conf/keys.conf" "$HOME/.config/tmux/conf/persistence.conf" "$HOME/.config/tmux/conf/status.conf" "$HOME/.config/tmux/conf/platform/macos.conf"' {
        set-option -g @dotfiles_foundation_loaded 1
      } {
        set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: failed to load required macOS foundation modules" ; source-file /dev/null/tmux-foundation-load-failed
      }
    } {
      set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: missing required config: $HOME/.config/tmux/conf/platform/macos.conf" ; source-file "$HOME/.config/tmux/conf/platform/macos.conf"
    }
  } {
    if-shell 'test "$(uname -s)" = Linux' {
      if-shell 'test -r "$HOME/.config/tmux/conf/platform/linux.conf"' {
        if-shell 'tmux -S "#{socket_path}" source-file "$HOME/.config/tmux/conf/options.conf" "$HOME/.config/tmux/conf/keys.conf" "$HOME/.config/tmux/conf/persistence.conf" "$HOME/.config/tmux/conf/status.conf" "$HOME/.config/tmux/conf/platform/linux.conf"' {
          set-option -g @dotfiles_foundation_loaded 1
        } {
          set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: failed to load required Linux foundation modules" ; source-file /dev/null/tmux-foundation-load-failed
        }
      } {
        set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: missing required config: $HOME/.config/tmux/conf/platform/linux.conf" ; source-file "$HOME/.config/tmux/conf/platform/linux.conf"
      }
    } {
      set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: unsupported platform from uname -s; expected Darwin or Linux" ; source-file /dev/null/tmux-unsupported-platform
    }
  }
} {
  if-shell 'test ! -r "$HOME/.config/tmux/conf/options.conf"' {
    set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: missing required config: $HOME/.config/tmux/conf/options.conf" ; source-file "$HOME/.config/tmux/conf/options.conf"
  } {
    if-shell 'test ! -r "$HOME/.config/tmux/conf/keys.conf"' {
      set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: missing required config: $HOME/.config/tmux/conf/keys.conf" ; source-file "$HOME/.config/tmux/conf/keys.conf"
    } {
      if-shell 'test ! -r "$HOME/.config/tmux/conf/persistence.conf"' {
        set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: missing required config: $HOME/.config/tmux/conf/persistence.conf" ; source-file "$HOME/.config/tmux/conf/persistence.conf"
      } {
        set-option -g @dotfiles_foundation_loaded 0 ; set-option -guq @dotfiles_platform ; display-message -p "tmux: missing required config: $HOME/.config/tmux/conf/status.conf" ; source-file "$HOME/.config/tmux/conf/status.conf"
      }
    }
  }
}
